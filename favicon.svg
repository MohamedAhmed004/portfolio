  <circle cx="52" cy="52" r="2" fill="#38BDF8" opacity="0.8"/>
  <path d="M12 12 L20 12 L20 20" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M52 52 L44 52 L44 44" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
