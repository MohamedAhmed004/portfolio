<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="matlabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#matlabBg)"/>
  <rect x="1" y="1" width="598" height="358" rx="11" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="600" height="36" rx="12" fill="#0B132B"/>
  <path d="M0 24 H600 V36 H0 Z" fill="#0B132B"/>
  <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
  <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
  <circle cx="52" cy="18" r="4.5" fill="#10B981"/>
  <text x="80" y="22" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">MATLAB App Designer // Data_Compression_Studio.m [Huffman · Shannon-Fano · LZ78]</text>

  <!-- Left: Binary Huffman / Code Tree Representation -->
  <rect x="24" y="52" width="260" height="286" rx="8" fill="#111827" stroke="#1E293B"/>
  <text x="38" y="74" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HUFFMAN SYNTHESIS TREE</text>

  <!-- Root Node -->
  <circle cx="154" cy="100" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="154" y="104" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">1.00</text>

  <!-- Level 1 -->
  <line x1="144" y1="112" x2="100" y2="150" stroke="#64748B" stroke-width="1.5"/>
  <line x1="164" y1="112" x2="208" y2="150" stroke="#64748B" stroke-width="1.5"/>
  <text x="114" y="128" fill="#38BDF8" font-family="monospace" font-size="9">'0'</text>
  <text x="190" y="128" fill="#38BDF8" font-family="monospace" font-size="9">'1'</text>

  <circle cx="95" cy="160" r="13" fill="#1E293B" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="95" y="164" fill="#22D3EE" font-family="monospace" font-size="9" text-anchor="middle">0.40</text>

  <circle cx="213" cy="160" r="13" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
  <text x="213" y="164" fill="#818CF8" font-family="monospace" font-size="9" text-anchor="middle">0.60</text>

  <!-- Level 2 Leaves -->
  <line x1="88" y1="171" x2="65" y2="210" stroke="#64748B" stroke-width="1.2"/>
  <line x1="102" y1="171" x2="125" y2="210" stroke="#64748B" stroke-width="1.2"/>

  <!-- Leaf A -->
  <rect x="45" y="210" width="40" height="24" rx="4" fill="#047857"/>
  <text x="65" y="226" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">A: '00'</text>

  <!-- Leaf B -->
  <rect x="105" y="210" width="40" height="24" rx="4" fill="#047857"/>
  <text x="125" y="226" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">B: '01'</text>

  <!-- Dictionary stats bottom -->
  <rect x="36" y="250" width="236" height="74" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <text x="46" y="268" fill="#94A3B8" font-family="monospace" font-size="10">Shannon Entropy H(X): <tspan fill="#38BDF8">2.14 bits/sym</tspan></text>
  <text x="46" y="286" fill="#94A3B8" font-family="monospace" font-size="10">Average Code Length L: <tspan fill="#34D399">2.18 bits/sym</tspan></text>
  <text x="46" y="304" fill="#94A3B8" font-family="monospace" font-size="10">Coding Efficiency η: <tspan fill="#F59E0B">98.16%</tspan></text>

  <!-- Right: Efficiency Comparison Plot -->
  <rect x="300" y="52" width="276" height="286" rx="8" fill="#111827" stroke="#1E293B"/>
  <text x="314" y="74" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">COMPRESSION RATIO COMPARISON</text>

  <!-- Grid lines -->
  <line x1="330" y1="100" x2="550" y2="100" stroke="#1F2937" stroke-width="1"/>
  <line x1="330" y1="150" x2="550" y2="150" stroke="#1F2937" stroke-width="1"/>
  <line x1="330" y1="200" x2="550" y2="200" stroke="#1F2937" stroke-width="1"/>
  <line x1="330" y1="250" x2="550" y2="250" stroke="#334155" stroke-width="1.5"/>

  <!-- Bar 1: Raw (Uncompressed) -->
  <rect x="345" y="110" width="46" height="140" rx="4" fill="#334155"/>
  <text x="368" y="104" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">100%</text>
  <text x="368" y="266" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Fixed 8b</text>

  <!-- Bar 2: Shannon-Fano -->
  <rect x="405" y="170" width="46" height="80" rx="4" fill="#3B82F6"/>
  <text x="428" y="164" fill="#60A5FA" font-family="monospace" font-size="10" text-anchor="middle">44.2%</text>
  <text x="428" y="266" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">S-Fano</text>

  <!-- Bar 3: Huffman Optimal -->
  <rect x="465" y="185" width="46" height="65" rx="4" fill="#10B981"/>
  <text x="488" y="179" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">38.7%</text>
  <text x="488" y="266" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Huffman</text>

  <!-- Bar 4: LZ78 Dictionary -->
  <rect x="525" y="195" width="46" height="55" rx="4" fill="#06B6D4"/>
  <text x="548" y="189" fill="#22D3EE" font-family="monospace" font-size="10" text-anchor="middle">34.1%</text>
  <text x="548" y="266" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">LZ78</text>

  <!-- Legend -->
  <g transform="translate(320, 290)">
    <circle cx="10" cy="14" r="4" fill="#10B981"/>
    <text x="20" y="18" fill="#E2E8F0" font-family="monospace" font-size="10">Optimal Variable-Length Prefix Codes</text>
  </g>
</svg>
