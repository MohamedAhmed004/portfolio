  <script>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {

              900: '#0F172A',
              950: '#0A0E17',
            },
            electric: {
              500: '#0284C7',
              600: '#0369A1',
            }
          },

            mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- JSON-LD Structured Data (Person) -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

    "name": "Mohamed Ahmed",

<body class="bg-[#0B0F17] text-slate-100 min-h-screen relative selection:bg-cyan-500 selection:text-black">

  <!-- Interactive Subtle Engineering Circuit Background -->
  <canvas id="circuit-bg" aria-hidden="true"></canvas>

  <!-- Navigation Bar Component Root -->
  <div id="navbar-root"></div>

  <!-- Main Website Body -->
  <main class="relative z-10">
    <div id="hero-root"></div>
    <div id="about-root"></div>
    <div id="skills-root"></div>
    <div id="projects-root"></div>
    <div id="workflow-root"></div>
    <div id="contact-root"></div>
  </main>

  <!-- Footer Component Root -->
  <div id="footer-root"></div>

  <!-- Reusable Case Study Modal Dialog -->
  <div 
    id="project-modal" 
    class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 overflow-y-auto"
    role="dialog" 
    aria-modal="true" 
    aria-labelledby="modal-title"
  >
    <!-- Dark Backdrop -->
    <div id="modal-backdrop" class="fixed inset-0 bg-[#060910]/85 backdrop-blur-md transition-opacity"></div>

    <!-- Modal Card Container -->
    <div 
      id="modal-container" 
      class="relative w-full max-w-4xl bg-[#0B0F17] border border-slate-800 rounded-2xl shadow-2xl overflow-hidden my-8 z-10 max-h-[90vh] flex flex-col"
    >
      <!-- Modal Close Button Top -->
      <button 
        id="modal-close" 
        aria-label="Close Case Study"
        class="absolute top-4 right-4 z-20 w-9 h-9 rounded-xl bg-slate-900/90 border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-800 flex items-center justify-center transition cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <!-- Scrollable Content Body -->
      <div id="modal-content" class="p-6 sm:p-8 overflow-y-auto space-y-6">
        <!-- Injected dynamically by modal.js -->
      </div>
    </div>
  </div>

  <!-- Main Modular Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
